[package]
name = "water-surface"
version = "0.1.0"
edition = "2024"
authors = ["eastspire <eastspire@users.noreply.github.com>"]
license = "MIT"
description = "Real-time liquid water and water ray-tracing on an infinite lake surface, rendered with WebGPU compute shaders via euv and euv-engine."
repository = "https://github.com/eastspire/water-surface"
readme = "README.md"
publish = false
exclude = [
    "target",
    "www",
    "Cargo.lock",
    "**/*.log",
    ".gitignore",
    "sh",
    ".github",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
euv = "*"
js-sys = "0.3"
euv-engine = "*"
wasm-bindgen = "0.2"
lombok-macros = "*"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "*"

[profile.dev]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"

[profile.release]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"
