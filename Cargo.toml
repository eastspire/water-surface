[package]
name = "water-surface"
version = "0.1.0"
edition = "2024"
authors = ["eastspire <eastspire@users.noreply.github.com>"]
license = "MIT"
description = "Real-time liquid water and water ray-tracing on an infinite lake surface, rendered with WebGPU compute shaders via euv and euv-engine."
repository = "https://github.com/eastspire/water-surface"
readme = "README.md"
publish = false
exclude = [
    "target",
    "www",
    "Cargo.lock",
    "**/*.log",
    ".gitignore",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
euv = "*"
euv-engine = "*"
lombok-macros = "*"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "*"
